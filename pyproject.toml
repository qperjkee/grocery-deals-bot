[project]
name = "grocery-deals-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "rapidfuzz>=3.14.6",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]
